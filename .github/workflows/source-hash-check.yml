name: Validate SDK source hash

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-source-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Runtime/SDK/ApexSourceHashGenerated.cs matches the Runtime sources
        run: python3 "Tools~/source_hash.py" --check
